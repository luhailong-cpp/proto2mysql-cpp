name: C++ tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: proto2mysql_test
          MYSQL_DATABASE: proto2mysql_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      PBMYSQL_TEST_HOST: 127.0.0.1
      PBMYSQL_TEST_PORT: 3306
      PBMYSQL_TEST_USER: root
      PBMYSQL_TEST_PASSWORD: proto2mysql_test
      PBMYSQL_TEST_DATABASE: proto2mysql_test
      PBMYSQL_TEST_TIDB_PORT: 33400
      PBMYSQL_TEST_TIDB0_PORT: 33401
      PBMYSQL_TEST_TIDB1_PORT: 33402
      PBMYSQL_TEST_SINGLE_READY_ATTEMPTS: 90
      PBMYSQL_TEST_CLUSTER_READY_ATTEMPTS: 120
      PBMYSQL_TEST_READY_POLL_SECONDS: 2
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libprotobuf-dev protobuf-compiler default-libmysqlclient-dev default-mysql-client libgtest-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - name: MySQL 8.4 tests
        run: ctest --test-dir build --output-on-failure
      - name: Install and test downstream auto-registration
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/pbmysql"
          cmake -S test/cmake_consumer -B build-consumer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pbmysql"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
      - name: TiDB single-node tests
        env:
          PBMYSQL_TEST_PORT: ${{ env.PBMYSQL_TEST_TIDB_PORT }}
          PBMYSQL_TEST_PASSWORD: ''
        run: |
          docker compose -f test/docker-compose.yml up -d tidb
          ready=0
          for attempt in $(seq 1 "$PBMYSQL_TEST_SINGLE_READY_ATTEMPTS"); do
            if mysql --protocol=TCP -h127.0.0.1 -P"$PBMYSQL_TEST_PORT" -uroot -e 'CREATE DATABASE IF NOT EXISTS proto2mysql_test'; then ready=1; break; fi
            sleep "$PBMYSQL_TEST_READY_POLL_SECONDS"
          done
          test "$ready" = 1
          ctest --test-dir build --output-on-failure
          docker compose -f test/docker-compose.yml stop tidb
      - name: TiDB two-node cluster tests
        env:
          PBMYSQL_TEST_PORT: ${{ env.PBMYSQL_TEST_TIDB0_PORT }}
          PBMYSQL_TEST_PASSWORD: ''
          PBMYSQL_TEST_HOST2: 127.0.0.1
          PBMYSQL_TEST_PORT2: ${{ env.PBMYSQL_TEST_TIDB1_PORT }}
        run: |
          docker compose -f test/docker-compose.yml up -d pd tikv tidb0 tidb1
          for port in "$PBMYSQL_TEST_PORT" "$PBMYSQL_TEST_PORT2"; do
            ready=0
            for attempt in $(seq 1 "$PBMYSQL_TEST_CLUSTER_READY_ATTEMPTS"); do
              if mysql --protocol=TCP -h127.0.0.1 -P"$port" -uroot -e 'CREATE DATABASE IF NOT EXISTS proto2mysql_test'; then ready=1; break; fi
              sleep "$PBMYSQL_TEST_READY_POLL_SECONDS"
            done
            test "$ready" = 1
          done
          ctest --test-dir build --output-on-failure
      - name: Stop disposable TiDB databases
        if: always()
        run: docker compose -f test/docker-compose.yml down
